<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consulta - Detector de Pedidos</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
}

.container {
    max-width: 700px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.subtitulo {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

#pedido {
    width: 100%;
    padding: 20px;
    font-size: 28px;
    text-align: center;
    border: 2px solid #aaa;
    border-radius: 10px;
    box-sizing: border-box;
    outline: none;
}

#pedido:focus {
    border-color: #007bff;
}

#resultado {
    margin-top: 20px;
    padding: 25px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    border-radius: 10px;
}

.aguardando {
    background: #eeeeee;
    color: #555;
}

.novo {
    background: #d4edda;
    color: #155724;
}

.duplicado {
    background: #f8d7da;
    color: #721c24;
}

.painel {
    display: flex;
    justify-content: space-around;
    margin-top: 25px;
    gap: 15px;
}

.card {
    text-align: center;
    flex: 1;
    padding: 15px;
    background: #f8f8f8;
    border-radius: 10px;
}

.numero {
    font-size: 32px;
    font-weight: bold;
    margin-top: 5px;
}

table {
    width: 100%;
    margin-top: 30px;
    border-collapse: collapse;
}

th,
td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

th {
    background: #eee;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: #333;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #555;
}

</style>

</head>

<body>

<div class="container">

    <h1>🔎 CONSULTA</h1>

    <p class="subtitulo">
        Bipe o pedido para verificar duplicidade
    </p>


    <!-- CAMPO DE LEITURA -->

    <input
        type="text"
        id="pedido"
        placeholder="Bipe o pedido"
        autocomplete="off"
        autofocus
    >


    <!-- RESULTADO -->

    <div
        id="resultado"
        class="aguardando"
    >
        Aguardando bipagem...
    </div>


    <!-- PAINEL -->

    <div class="painel">

        <div class="card">

            <div>Total de pedidos</div>

            <div
                id="total"
                class="numero"
            >
                0
            </div>

        </div>


        <div class="card">

            <div>Duplicados</div>

            <div
                id="duplicados"
                class="numero"
            >
                0
            </div>

        </div>

    </div>


    <!-- HISTÓRICO -->

    <table>

        <thead>

            <tr>

                <th>Pedido</th>

                <th>Status</th>

                <th>Qtd.</th>

            </tr>

        </thead>


        <tbody id="historico">

        </tbody>

    </table>


    <!-- LIMPAR -->

    <button onclick="limparHistorico()">

        LIMPAR HISTÓRICO

    </button>

</div>


<script>


/*
========================================================
BANCO LOCAL DO NAVEGADOR
========================================================
*/

let pedidos =
JSON.parse(
    localStorage.getItem("pedidos")
) || {};


/*
========================================================
CAMPO DO PEDIDO
========================================================
*/

const campo =
document.getElementById("pedido");


/*
========================================================
TEMPORIZADOR DA BIPAGEM
========================================================
*/

let timer = null;


/*
========================================================
ENTER MANUAL
========================================================
*/

campo.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            verificarPedido();

        }

    }
);


/*
========================================================
BIPAGEM AUTOMÁTICA
========================================================

O Zebra envia os números rapidamente.

Quando parar de enviar caracteres,
o sistema aguarda 150ms e processa automaticamente.

Não precisa apertar ENTER.
========================================================
*/

campo.addEventListener(
    "input",
    function() {

        clearTimeout(timer);

        timer = setTimeout(
            function() {

                if (
                    campo.value.trim() !== ""
                ) {

                    verificarPedido();

                }

            },
            150
        );

    }
);


/*
========================================================
VERIFICAR PEDIDO
========================================================
*/

function verificarPedido() {

    let pedido =
    campo.value.trim();


    /*
    NÃO PROCESSA CAMPO VAZIO
    */

    if (pedido === "") {

        return;

    }


    /*
    REMOVE ESPAÇOS
    */

    pedido =
    pedido.replace(/\s/g, "");


    /*
    PEDIDO JÁ EXISTE
    */

    if (pedidos[pedido]) {

        pedidos[pedido]++;

        mostrarDuplicado(pedido);

    }


    /*
    PEDIDO NOVO
    */

    else {

        pedidos[pedido] = 1;

        mostrarNovo(pedido);

    }


    /*
    SALVA
    */

    salvar();


    /*
    ATUALIZA TABELA
    */

    atualizarTabela();


    /*
    LIMPA CAMPO
    */

    campo.value = "";


    /*
    DEVOLVE FOCO
    */

    campo.focus();

}


/*
========================================================
PEDIDO NOVO
========================================================
*/

function mostrarNovo(pedido) {

    const resultado =
    document.getElementById("resultado");


    resultado.className =
    "novo";


    resultado.innerHTML =

        "🟢 PEDIDO NOVO" +

        "<br><br>" +

        "Pedido: " +

        pedido;

}


/*
========================================================
PEDIDO DUPLICADO
========================================================
*/

function mostrarDuplicado(pedido) {

    const resultado =
    document.getElementById("resultado");


    resultado.className =
    "duplicado";


    resultado.innerHTML =

        "🚨 PEDIDO DUPLICADO" +

        "<br><br>" +

        "Pedido: " +

        pedido +

        "<br><br>" +

        "Já foi bipado " +

        pedidos[pedido] +

        " vezes.";

}


/*
========================================================
SALVAR
========================================================
*/

function salvar() {

    localStorage.setItem(
        "pedidos",
        JSON.stringify(pedidos)
    );

}


/*
========================================================
ATUALIZAR TABELA
========================================================
*/

function atualizarTabela() {

    let total = 0;

    let duplicados = 0;

    let tabela = "";


    /*
    PERCORRE TODOS OS PEDIDOS
    */

    for (
        let pedido in pedidos
    ) {


        total++;


        /*
        VERIFICA DUPLICADOS
        */

        if (
            pedidos[pedido] > 1
        ) {

            duplicados++;

        }


        /*
        STATUS
        */

        let status =

            pedidos[pedido] > 1

            ? "🚨 DUPLICADO"

            : "🟢 OK";


        /*
        LINHA DA TABELA
        */

        tabela += `

            <tr>

                <td>
                    ${pedido}
                </td>

                <td>
                    ${status}
                </td>

                <td>
                    ${pedidos[pedido]}
                </td>

            </tr>

        `;

    }


    /*
    TOTAL
    */

    document.getElementById(
        "total"
    ).innerText = total;


    /*
    DUPLICADOS
    */

    document.getElementById(
        "duplicados"
    ).innerText = duplicados;


    /*
    HISTÓRICO
    */

    document.getElementById(
        "historico"
    ).innerHTML = tabela;

}


/*
========================================================
LIMPAR HISTÓRICO
========================================================
*/

function limparHistorico() {


    let confirmar =

        confirm(
            "Deseja realmente apagar todo o histórico?"
        );


    if (!confirmar) {

        return;

    }


    /*
    APAGA OS DADOS
    */

    pedidos = {};


    localStorage.removeItem(
        "pedidos"
    );


    /*
    RESTAURA TELA
    */

    document.getElementById(
        "resultado"
    ).className =
        "aguardando";


    document.getElementById(
        "resultado"
    ).innerHTML =
        "Aguardando bipagem...";


    /*
    ATUALIZA
    */

    atualizarTabela();


    /*
    FOCO
    */

    campo.focus();

}


/*
========================================================
INICIALIZA SISTEMA
========================================================
*/

atualizarTabela();

campo.focus();

</script>

</body>

</html>
